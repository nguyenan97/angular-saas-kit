<!-- A plain link to this page's main (see skipLink): it works before the page
     hydrates, and main's tabindex lets the browser move focus there. -->
<a
  [href]="skipLink()"
  class="sr-only rounded-md border border-border bg-background px-3 py-2 text-sm font-medium focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50"
  >Skip to content</a
>

<div class="flex min-h-dvh flex-col bg-background text-foreground">
  <header class="sticky top-0 z-30 border-b border-border bg-background/80 backdrop-blur">
    <div class="mx-auto flex h-topbar max-w-6xl items-center gap-3 px-6">
      <a routerLink="/" class="flex items-center gap-3 rounded-md text-sm font-semibold">
        <span class="size-6 rounded-md bg-primary"></span>
        Angular SaaS Kit
      </a>

      <nav class="ml-auto flex items-center gap-1" aria-label="Main">
        <!-- The sections are one scroll away on a phone, and the footer links
             to the blog, so these links start at the sm breakpoint, where the
             header has room. -->
        @for (section of sections; track section.id) {
          <a
            askButton
            variant="ghost"
            size="sm"
            class="hidden text-muted-foreground sm:inline-flex"
            [href]="'#' + section.id"
            >{{ section.label }}</a
          >
        }
        <a
          askButton
          variant="ghost"
          size="sm"
          class="hidden text-muted-foreground aria-[current=page]:text-foreground sm:inline-flex"
          routerLink="/blog"
          [attr.aria-current]="onBlogIndex() ? 'page' : null"
          >Blog</a
        >
        <a
          askButton
          variant="ghost"
          size="sm"
          class="text-muted-foreground"
          href="https://github.com/nguyenan97/angular-saas-kit"
          >GitHub</a
        >
        <button askButton type="button" variant="outline" size="sm" (click)="theme.toggleMode()">
          {{ theme.isDark() ? 'Light' : 'Dark' }}
        </button>
      </nav>
    </div>
  </header>

  <main id="main-content" tabindex="-1" class="flex-1 focus-visible:outline-none">
    <router-outlet />
  </main>

  <footer class="border-t border-border">
    <div
      class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-6 py-8 text-xs text-muted-foreground"
    >
      <p>MIT licensed. Built with Angular {{ angularVersion }}.</p>
      <nav class="flex gap-4" aria-label="Footer">
        <a routerLink="/blog" class="rounded-sm hover:text-foreground">Blog</a>
        <a
          href="https://github.com/nguyenan97/angular-saas-kit"
          class="rounded-sm hover:text-foreground"
          >GitHub</a
        >
      </nav>
    </div>
  </footer>
</div>
