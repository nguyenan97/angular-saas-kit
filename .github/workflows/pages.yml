name: Pages

# Builds the site: the landing page at the root, the dashboard demo under /demo/
# and the documentation under /docs/. Every pull request gets the build and the
# site checks, so a broken base href or a dead documentation link is caught
# before it ships; only `main` deploys.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one that is already publishing.
# Pull request builds are disposable, so a newer push may cancel an older one.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_DAEMON: false

jobs:
  pages-build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Builds both apps with the `pages` configuration and the docs, assembles
      # _site and verifies that every local file the pages reference exists.
      - name: Build and check the site
        run: npm run pages

      # Also lets a reviewer download the built site from a pull request run.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 7

  pages-deploy:
    name: Deploy site
    needs: pages-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
