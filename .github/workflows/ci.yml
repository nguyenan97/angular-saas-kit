name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR makes the in-flight run pointless - cancel it rather than
# burning minutes on a commit nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_DAEMON: false

jobs:
  verify:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      # Report every failing gate in one run instead of stopping at the first.
      fail-fast: false
      matrix:
        target: [lint, test, build]

    steps:
      - uses: actions/checkout@v7
        with:
          # Nx `affected` needs history to diff against the base branch.
          fetch-depth: 0

      # Sets NX_BASE / NX_HEAD so `nx affected` diffs against the right
      # commits for both push and pull_request events.
      - uses: nrwl/nx-set-shas@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Run ${{ matrix.target }}
        run: npx nx affected -t ${{ matrix.target }} --output-style=static

      # The C4 container map in docs/architecture must match the code. It has no
      # dependencies and takes well under a second, so it rides on the lint leg
      # instead of getting a runner of its own. `!cancelled()` reports it even
      # when lint failed, so one run shows both problems.
      - name: Check the architecture map
        if: matrix.target == 'lint' && !cancelled()
        run: node scripts/check-architecture.mjs

      # The built libraries have to install and work on their own: every import
      # declared, every promised file shipped. It only means something after a
      # build, and says so when a change reaches no library and nothing was built.
      - name: Check the built packages
        if: matrix.target == 'build'
        run: node scripts/check-packages.mjs

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The build compiles with the app tsconfigs; this catches anything the
      # build's own program does not include, such as spec-only type errors.
      - run: npx tsc -p tsconfig.base.json --noEmit

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --check .

  # The browser tests. They prove what jsdom cannot, such as the keyboard
  # behaviour of a radio group, and the theme surviving a reload with no flash.
  # Not a required check yet: it is new, and a flaky required check blocks every
  # merge, so it earns that after a run of clean results.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # One engine is enough for what these tests prove, and each extra one adds
      # about a minute. The config lists Firefox and WebKit for a local run.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Playwright starts the dashboard dev server itself (see the config).
      - name: Run the browser tests
        working-directory: apps/dashboard-e2e
        run: npx playwright test --project=chromium

      - name: Keep the report and traces of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: dist/.playwright/apps/dashboard-e2e
          retention-days: 7
