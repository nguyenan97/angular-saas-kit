name: Security

# Supply-chain checks on every pull request (ADR 0024). Each judges what the
# change adds, so an advisory that `main` already carries does not block an
# unrelated pull request. No path filter: a required check that never runs
# would hold a pull request forever (ADR 0009).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static analysis of the workflows themselves: template injection, broad
  # permissions, unpinned actions, credentials left in the checkout.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Without Advanced Security mode the job fails on a finding, so it can
      # be a required check rather than an alert to read.
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false

  # Fails a pull request that adds or upgrades to a dependency with a known
  # vulnerability at high or above, or under a licence outside the list.
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: >-
            MIT, MIT-0, ISC, 0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause,
            BlueOak-1.0.0, CC0-1.0, CC-BY-4.0, Unlicense, Python-2.0, MPL-2.0,
            OFL-1.1

  # Secrets in the commits a change adds. Push protection rejects the formats
  # GitHub's partners register; gitleaks also catches generic ones (a key-like
  # assignment with high entropy, a private key block). The image is pinned by
  # digest, like the actions, and gets no token.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan the new commits
        env:
          # A pull request: its own commits. A push to main: what the push
          # added; when there is no usable "before" (a first push is all
          # zeros, a force push names a commit the clone lacks), the pushed
          # commit alone.
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            range="$FROM..$TO"
          else
            range="-1 $TO"
          fi
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --log-opts="$range" --redact --verbose --exit-code 1
