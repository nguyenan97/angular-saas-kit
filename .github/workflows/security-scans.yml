name: Security scans

# Scans that judge the whole tree or a running site rather than one change
# (ADR 0026). They report to code scanning or as artifacts and never block a
# pull request: the per-change gates are in security.yml and codeql.yml.
on:
  schedule:
    - cron: '23 5 * * 1' # Monday 05:23 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A scan that has started runs to the end: a push to main must not cancel
  # the weekly run halfway through its upload.
  cancel-in-progress: false

env:
  NX_DAEMON: false

jobs:
  # The lockfile against OSV, which collects GitHub's, npm's and other
  # advisory databases. Findings go to code scanning; the job stays green.
  osv:
    name: OSV
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: --lockfile=package-lock.json
      fail-on-vuln: false

  # A CycloneDX SBOM of what the apps ship (production dependencies), kept as
  # an artifact. When a package is published it goes with the release.
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Write the SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  # A passive ZAP scan of the built Pages site, served locally the way Pages
  # serves it. Pages sends a fixed set of headers and lets a site add none, so a
  # missing-header finding here is about Pages and the preview server, not
  # something this repository can set; the next job covers the server it can.
  # Report only.
  zap:
    name: ZAP baseline (Pages site)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the site
        run: npm run pages
      - name: Serve it
        run: |
          nohup node scripts/preview-pages.mjs > preview.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8123/angular-saas-kit/ > /dev/null && exit 0
            sleep 1
          done
          cat preview.log
          exit 1
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8123/angular-saas-kit/
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline

  # The same passive scan against the landing page's own Node server, the one
  # piece of the kit that sets its own headers (security-headers.ts). GitHub
  # Pages cannot set headers, so the job above reports them missing; this one
  # reports what the server the repository controls actually sends.
  zap-landing:
    name: ZAP baseline (landing server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the landing page
        run: npx nx build landing --output-style=static
      # The server answers 400 to every host it is not told about.
      - name: Serve it
        env:
          NG_ALLOWED_HOSTS: localhost
          PORT: '4000'
        run: |
          nohup node dist/apps/landing/server/server.mjs > server.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4000/ > /dev/null && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:4000/
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline-landing
