name: Scorecard

# OpenSSF Scorecard grades the repository's security practices from outside:
# branch protection, pinned dependencies, token permissions, code review and
# more (ADR 0024). Results go to code scanning and to the public badge. It must
# stay a workflow of its own with no other job, or publishing is refused.
on:
  branch_protection_rule:
  schedule:
    - cron: '41 4 * * 1' # Monday 04:41 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # Publish the results and get the badge.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
