version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before taking a new release: most compromised packages are
    # caught and pulled within days (ADR 0024). Security updates ignore this.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Angular packages must move together or the build breaks on a
      # half-upgraded tree. @schematics/angular ships with @angular/cli at the
      # same version; left out, it lands in dev-minor and each PR installs a
      # nested copy of the other's version.
      angular:
        patterns:
          [
            '@angular/*',
            '@angular-devkit/*',
            '@schematics/angular',
            'angular-eslint',
          ]
      nx:
        patterns: ['@nx/*', 'nx']
      dev-minor:
        dependency-type: development
        update-types: [minor, patch]
        # Keep the two groups above intact. Without this, dev-only Angular and
        # Nx packages (build, cli, compiler-cli, ...) land here instead, which
        # splits the Angular set across two PRs that cannot be installed on
        # their own: @angular/compiler and @angular/compiler-cli peer-depend
        # on each other's exact version.
        exclude-patterns:
          [
            '@angular/*',
            '@angular-devkit/*',
            '@schematics/angular',
            'angular-eslint',
            '@nx/*',
            'nx',
          ]
    ignore:
      # Vitest 5 is not supported yet: @angular/build wants ^4.0.8, @nx/vitest
      # ^3 || ^4 and @analogjs/vitest-angular <= ^4. Drop these two entries
      # once all three widen their peer range.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
      # Types must track the minimum supported Node (22, see .nvmrc and
      # engines), not the newest one.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # The compiler follows Angular: @angular/compiler-cli, @angular/build and
      # @angular-devkit/build-angular 22.2 want typescript >=6.0 <6.1, so a major
      # fails `npm ci` with ERESOLVE. Drop this when an Angular release widens
      # that range; the Angular group's PR brings the TypeScript bump with it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
