name: Accessibility issue
description: A keyboard, screen reader, contrast or focus problem.
labels: [a11y]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is inaccessible
      description: Which element, and what fails.
    validations: { required: true }
  - type: dropdown
    id: kind
    attributes:
      label: Category
      options:
        - Keyboard navigation
        - Screen reader announcement
        - Colour contrast
        - Focus management
        - Motion / vestibular
        - Other
    validations: { required: true }
  - type: input
    id: tooling
    attributes:
      label: Screen reader / browser, if relevant
      placeholder: NVDA 2025.1 + Firefox
  - type: input
    id: wcag
    attributes:
      label: WCAG criterion, if you know it
      placeholder: 2.4.7 Focus Visible
